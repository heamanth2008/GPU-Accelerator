<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neuro Music – Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="backdrop"></div>
  <div class="stage">
    <!-- Player UI -->
    <div class="player-panel" style="background:var(--glass-fill-strong); border:1px solid var(--glass-border); backdrop-filter:blur(20px); border-radius:20px; padding:20px; margin-top:40px;">
      <div id="player-art" class="player-art" style="width:200px;height:200px;margin:auto;border-radius:16px;display:flex;align-items:center;justify-content:center;background:#333;">
        <!-- Album art gradient will be injected -->
      </div>
      <h2 id="player-name" style="margin:16px 0 4px;text-align:center;color:var(--text-0);font-family:'Space Grotesk',sans-serif;">Song Title</h2>
      <p id="player-artist" style="margin:0 0 16px;text-align:center;color:var(--text-1);font-size:14px;">Artist</p>
      <div style="display:flex;justify-content:center;gap:24px;">
        <button class="icon-btn" id="prevBtn" aria-label="Previous"><i data-lucide="rewind" style="width:24px;height:24px;"></i></button>
        <button class="icon-btn" id="playPauseBtn" aria-label="Play/Pause"><i data-lucide="play" style="width:28px;height:28px;"></i></button>
        <button class="icon-btn" id="nextBtn" aria-label="Next"><i data-lucide="fast-forward" style="width:24px;height:24px;"></i></button>
      </div>
      <div style="margin-top:20px;display:flex;align-items:center;gap:8px;">
        <input type="range" id="volumeSlider" min="0" max="100" value="70" style="flex:1;" />
        <button class="icon-btn" id="muteBtn" aria-label="Mute"><i data-lucide="volume-2" style="width:20px;height:20px;"></i></button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Attach player controls
    document.getElementById('playPauseBtn').addEventListener('click', togglePlay);
    document.getElementById('prevBtn').addEventListener('click', prevTrack);
    document.getElementById('nextBtn').addEventListener('click', nextTrack);
    document.getElementById('muteBtn').addEventListener('click', toggleMute);
    document.getElementById('volumeSlider').addEventListener('input', (e) => {
      const v = e.target.value/100;
      S.vol = v; S.mute = false;
      if(ytPlayer) ytPlayer.setVolume(v*100);
      localStorage.setItem('neuro_liked_songs', JSON.stringify(S.likedSongs));
    });
    // Register service worker for PWA
    if('serviceWorker' in navigator){ navigator.serviceWorker.register('service-worker.js'); }
  </script>
</body>
</html>
